name: Glow snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/glow-snake.svg?color_snake=#c78a22&color_dots=#ebedf0,#ffe8b0,#ffd166,#f5a623,#c78a22
            dist/glow-snake-dark.svg?palette=github-dark&color_snake=#ffd166&color_dots=#161b22,#4a3410,#7a5418,#c78a22,#f5a623

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
